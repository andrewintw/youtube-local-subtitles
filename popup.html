<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>YouTube 本地字幕載入器</title>
  <style>
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #140f0a;
      --panel: #1d1610;
      --panel-2: #241a10;
      --text: #f4e9dc;
      --muted: #b39a80;
      --border: rgba(255, 138, 30, 0.28);
      --accent: #ff8a1e;
      --accent-2: #ffb14d;
      --glow: rgba(255, 138, 30, 0.45);
      --track: #2c2116;
      --knob: #b39a80;
      --knob-on: #180d03;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fdf6ec;
      --panel: #ffffff;
      --panel-2: #fbeede;
      --text: #2a2016;
      --muted: #8a7360;
      --border: rgba(224, 106, 0, 0.30);
      --accent: #e06a00;
      --accent-2: #ff9d33;
      --glow: rgba(224, 106, 0, 0.35);
      --track: #f0dcc4;
      --knob: #b99a78;
      --knob-on: #fff6ea;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 12px;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      font-size: 13px;
      background:
        repeating-linear-gradient(0deg, rgba(255, 138, 30, 0.035) 0 1px, transparent 1px 3px),
        var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .theme-toggle { display: flex; gap: 4px; }
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .icon:hover { border-color: var(--accent); }
    .icon.active {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--glow);
    }
    .status {
      display: none;
      padding: 8px 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      background: var(--panel);
      border-left: 3px solid #e0533a;
      color: #ff9f8a;
      line-height: 1.4;
      word-break: break-all;
    }
    .file-btn {
      display: block;
      text-align: center;
      padding: 10px;
      margin-bottom: 6px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #180d03;
      font-family: "Consolas", "Courier New", monospace;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 14px var(--glow);
    }
    .file-btn:hover { filter: brightness(1.08); }
    .file-btn input { display: none; }
    .file-info {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.4;
      word-break: break-all;
    }
    .file-info.ok { color: var(--accent); }

    .panel {
      padding: 10px 10px 2px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .row.toggle { justify-content: space-between; }
    .row > .label {
      flex: 0 0 auto;
      color: var(--muted);
      font-family: "Consolas", "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
    .row .val { flex: 0 0 42px; text-align: right; color: var(--muted); }

    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--track);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .switch .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: var(--knob);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .switch input:checked + .slider {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--glow);
    }
    .switch input:checked + .slider::before { transform: translateX(18px); background: var(--knob-on); }

    button {
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }
    button:hover { border-color: var(--accent); }
    button.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px var(--glow) inset, 0 0 8px var(--glow);
    }
    button.full { width: 100%; margin-bottom: 6px; }
    .hint {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="title">YouTube 本地字幕載入器</span>
    </div>
    <div class="theme-toggle">
      <button class="icon" id="themeDark" title="深色" aria-label="深色">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20 13.4A8.4 8.4 0 1110.6 4 6.6 6.6 0 0020 13.4z"/></svg>
      </button>
      <button class="icon" id="themeLight" title="淺色" aria-label="淺色">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>

  <div id="status" class="status"></div>

  <label class="file-btn">
    選擇字幕檔 (.srt / .vtt)
    <input type="file" id="file" accept=".srt,.vtt,text/plain">
  </label>
  <p class="file-info" id="fileInfo">尚未載入字幕</p>

  <div class="row toggle">
    <span class="label">顯示字幕</span>
    <label class="switch"><input type="checkbox" id="enabled" checked><span class="slider"></span></label>
  </div>

  <button class="full" id="editToggle">調整字幕大小與位置</button>
  <p class="hint">拖曳框內移動、拉邊框縮放；Esc 結束並繼續播放。</p>

  <div class="panel">
    <div class="row">
      <span class="label">字體大小</span>
      <input type="range" id="fontSize" min="16" max="48" step="1" value="30">
      <span class="val" id="fontSizeVal">30px</span>
    </div>
    <div class="row">
      <span class="label">底色濃度</span>
      <input type="range" id="bgAlpha" min="0" max="100" step="5" value="55">
      <span class="val" id="bgAlphaVal">55%</span>
    </div>
    <div class="row">
      <span class="label">時間微調</span>
      <input type="range" id="offset" min="-5000" max="5000" step="100" value="0">
      <span class="val" id="offsetVal">0.0s</span>
    </div>
  </div>

  <button class="full" id="clear">清除字幕</button>

  <script src="parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
